[build]
  command = "npm run build:netlify"
  publish = "dist"

# Redirect and rewrite order is generated from the checked-in editorial registry
# and 100-URL migration audit into dist/_redirects. That file normalizes the host,
# applies exact legacy dispositions, protects unknown editorial namespaces with a
# real 404, and places the SPA fallback last.

# Security headers for all routes
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Blog-specific caching headers
[[headers]]
  for = "/blog/*"
  [headers.values]
    Cache-Control = "public, max-age=0, s-maxage=300, stale-while-revalidate=600"
    Vary = "Accept-Encoding"

# Guides-specific caching headers
[[headers]]
  for = "/guides/*"
  [headers.values]
    Cache-Control = "public, max-age=0, s-maxage=300, stale-while-revalidate=600"
    Vary = "Accept-Encoding"

# Support-specific caching headers
[[headers]]
  for = "/support/*"
  [headers.values]
    Cache-Control = "public, max-age=0, s-maxage=300, stale-while-revalidate=600"
    Vary = "Accept-Encoding"

# Asset caching
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
