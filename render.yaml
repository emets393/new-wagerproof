# =============================================================================
# WagerProof MODEL PIPELINE — Render Blueprint (new-wagerproof repo)
#
# Runs the NEW NFL/CFB model runners + the post-game grade job. Parallel to the
# cfb_automation/render.yaml blueprint (which holds the legacy + MLB/NBA/NCAAB crons),
# so "everything is in Render" across the two repos.
#
# DEPLOY STEPS (one-time):
#   1) Connect this repo to Render as a Blueprint (New > Blueprint > new-wagerproof).
#   2) Fill the env group `wagerproof-model-secrets` (values are sync:false = set in dashboard):
#        SUPABASE_SERVICE_KEY, CFBD_API_KEY, ODDS_API_KEY, DATABASE_URL
#      DATABASE_URL = Supabase direct/pooler URI (the grade RPC exceeds PostgREST's 8s timeout).
#   3) COMMIT the frozen models: research/{nfl-extreme-outcomes/data,cfb-model/out}/*_<season>.pkl.
#      Render cron filesystems are EPHEMERAL — a `--train` run does NOT persist between runs, so
#      the scoring crons load the committed .pkl. Preseason: run with --train locally (or a one-off
#      Render job), commit the new sides_models_<season>.pkl / totals_b15|b55 / cfb_models|confirm.
#   4) COMMIT the runners + scripts (run_nfl_week.sh, run_cfb_week.sh, grade_week.sh, fill_finals.py,
#      ingest_player_logs.py, fetch.py, the build/model code) — they are not all tracked yet.
#
# OPEN OPERATIONAL ITEMS (before Week 1):
#   - WEEK is auto-derived by current_week.py (first unplayed week from the schedule), so the slate
#     crons need no manual week setting; the grade cron is season-scoped (grades all weeks idempotently).
#   - Injury re-score before kickoff: DONE 2026-09-15 — espn_nfl_injuries.py runs first in the
#     slate runner, and nfl-slate-gameday-{sun,prime} re-run the runner right after inactives post.
#   - Migrate the legacy NFL/CFB GitHub Actions crons here too (the dual-feed legacy prediction tables
#     that feed the legacy_* signals — see 14_SEASON_2026_PIPELINE_READINESS.md).
# =============================================================================

envVarGroups:
  - name: wagerproof-model-secrets
    envVars:
      - key: SUPABASE_SERVICE_KEY      # service-role key (writes slate_* tables, finals, logs)
        sync: false
      - key: FP_DATA_TOKEN             # Fantasy Points Data Suite JWT (fp-data-inseason); recapture from the web app on 401
        sync: false
      - key: CFBD_API_KEY              # College Football Data API (CFB fetch)
        sync: false
      - key: ODDS_API_KEY             # The Odds API (event/odds history)
        sync: false
      - key: DATABASE_URL             # Supabase direct/pooler URI (grade RPC, bypasses 8s API timeout)
        sync: false

services:
  # --- NFL weekly slate: fetch -> build -> .pkl predict -> nfl_slate_* tables ----------
  - type: cron
    name: nfl-slate-weekly
    runtime: python
    plan: standard                         # 2GB — fetch step OOM-killed (exit 137) on starter's 512MB (2026-08-10)
    schedule: "0 11 * 9-12,1-2 2"          # Tue ~6-7am ET, NFL season (Sep–Feb)
    buildCommand: >-
      pip install -r research/requirements.txt &&
      printf 'SUPABASE_SERVICE_KEY=%s\nCFBD_API_KEY=%s\nODDS_API_KEY=%s\n'
      "$SUPABASE_SERVICE_KEY" "$CFBD_API_KEY" "$ODDS_API_KEY" > .env.local
    startCommand: cd research/nfl-extreme-outcomes && bash run_nfl_week.sh   # no args -> resolve_nfl_week.py (wk1 until wk1 done, then advance)
    envVars:
      - fromGroup: wagerproof-model-secrets
      - key: PYTHON_VERSION          # freeze-env pair: pinned requirements need cp311 wheels
        value: "3.11.9"

  # --- NFL Monday PREVIEW: next week's slate a day early (owner 2026-09-21) -------------
  # Books post next week's lines by Sunday night (wk3 2026: 14/16 games, 11 books, on the
  # Monday). Without this the board sits on a finished week from the moment Monday night
  # kicks off until Tuesday's 11:00 UTC build — the feed anchors to the soonest UPCOMING
  # kickoff, so a completed week has nothing ahead of it.
  # `--preview` = the first week with ZERO games kicked off, which is next week whether or
  # not tonight's MNF is still pending (plain resolve()+1 would skip a week when there is
  # no Monday game). Built WITHOUT that night's MNF result by design; Tuesday's normal run
  # rebuilds the same week once it lands.
  - type: cron
    name: nfl-slate-monday-preview
    runtime: python
    plan: standard                         # same 2GB as the Tuesday build (fetch step OOMs on 512MB)
    schedule: "0 12 * 9-12,1-2 1"          # Mon ~8am ET, after the 08:00 UTC grade run
    buildCommand: >-
      pip install -r research/requirements.txt &&
      printf 'SUPABASE_SERVICE_KEY=%s\nCFBD_API_KEY=%s\nODDS_API_KEY=%s\n'
      "$SUPABASE_SERVICE_KEY" "$CFBD_API_KEY" "$ODDS_API_KEY" > .env.local
    startCommand: >-
      cd research/nfl-extreme-outcomes &&
      SW=$(python3 resolve_nfl_week.py --preview) &&
      bash run_nfl_week.sh ${SW% *} ${SW#* }
    envVars:
      - fromGroup: wagerproof-model-secrets
      - key: PYTHON_VERSION          # freeze-env pair: pinned requirements need cp311 wheels
        value: "3.11.9"

  # --- CFB weekly slate: fetch CFBD -> build features -> model -> cfb_slate_* tables ----
  - type: cron
    name: cfb-slate-weekly
    runtime: python
    # standard (2GB) like cfb-slate-refresh: the Monday rebuild runs the full
    # as-of ratings/tendencies pipeline and OOMed the 512Mi starter (2026-08-31).
    plan: standard
    schedule: "0 11 * 8-12,1 1"            # Mon ~6-7am ET, CFB season (Aug–Jan)
    buildCommand: >-
      pip install -r research/requirements.txt &&
      printf 'SUPABASE_SERVICE_KEY=%s\nCFBD_API_KEY=%s\nODDS_API_KEY=%s\n'
      "$SUPABASE_SERVICE_KEY" "$CFBD_API_KEY" "$ODDS_API_KEY" > .env.local
    startCommand: cd research/cfb-model && bash run_cfb_week.sh   # no args -> resolve_cfb_week.py (CFBD calendar)
    envVars:
      - fromGroup: wagerproof-model-secrets
      - key: PYTHON_VERSION          # freeze-env pair: pinned requirements need cp311 wheels
        value: "3.11.9"

  # --- Football regression reports (owner spec 2026-08-30): ONE living document
  # per sport-week, updated daily — storylines append/update/resolve on the
  # record, LLM writes the narrative over curated storylines only, NO PICKS.
  # 15:05 UTC = after the 13:00 grade cron and the 14:00 slate refresh (which
  # rescrapes injuries + recomputes flags), so the report always reads fresh
  # inputs — the MLB report's post-ingestion sequencing discipline.
  - type: cron
    name: football-regression-reports
    runtime: python
    # Two runs: 08:30 UTC (4:30am ET) right after the early grade pass so the model record and
    # yesterday's results show first thing, and 15:30 UTC after the 14:00 slate refresh so line
    # movement / injury cards update (owner 2026-09-20: records were showing at 11am ET).
    schedule: "30 8,15 * 8-12,1-2 *"       # daily 4:30am + 11:30am ET, football season
    buildCommand: >-
      pip install -r research/requirements.txt &&
      printf 'SUPABASE_SERVICE_KEY=%s\nOPENAI_API_KEY_REPORTS=%s\n'
      "$SUPABASE_SERVICE_KEY" "$OPENAI_API_KEY_REPORTS" > .env.local
    startCommand: >-
      { python3 research/football_model_record.py || true; } &&
      { cd research/cfb-model && python3 gen_cfb_regression_report.py || true; } &&
      { cd ../nfl-extreme-outcomes && python3 gen_nfl_regression_report.py || true; }
    envVars:
      - fromGroup: wagerproof-model-secrets
      - key: PYTHON_VERSION
        value: "3.11.9"

  # --- NFL mid-week slate REFRESH (CFB port, owner 2026-08-30): full pipeline
  # rerun 3x daily in season so line-sensitive conviction/flags recompute; the
  # 15-min refresher handles lines + side flips between rebuilds (flips demote
  # conviction to none until this rerun re-derives the NFL ladder).
  - type: cron
    name: nfl-slate-refresh
    runtime: python
    plan: standard
    schedule: "0 14,18,22 * 9-12,1-2 *"    # daily 10am/2pm/6pm ET, NFL season
    # (injuries: espn_nfl_injuries.py is step 0 of run_nfl_week.sh — see the game-day crons below)
    buildCommand: >-
      pip install -r research/requirements.txt &&
      printf 'SUPABASE_SERVICE_KEY=%s\nCFBD_API_KEY=%s\nODDS_API_KEY=%s\n'
      "$SUPABASE_SERVICE_KEY" "$CFBD_API_KEY" "$ODDS_API_KEY" > .env.local
    startCommand: cd research/nfl-extreme-outcomes && bash run_nfl_week.sh && { python3 refresh_nfl_slate_lines.py || true; }
    envVars:
      - fromGroup: wagerproof-model-secrets
      - key: PYTHON_VERSION
        value: "3.11.9"

  # --- NFL Player Prop Report, DAILY (owner 2026-09-23). The report's storylines used to be
  # rebuilt only by fp-data-inseason (Tue + Thu), which meant it was written on Tuesday against
  # a board that was ~10% posted and then not refreshed again until Thursday — kickoff day. Books
  # post anytime-TD early and the yardage markets late, so on the Tuesday run week 3 had 19
  # reception-yard lines against 193 in a finished week, and only 2 of the report's 10 slots
  # filled. This runs the same chain once a day so the report tracks the board as lines post AND
  # picks up that morning's injury news and newly posted lines.
  #
  # It runs ONLY the two steps nothing else covers — model scores, then the report. The first
  # version also ran espn_nfl_injuries.py and nfl_slate_props_build.py and died on its first real
  # run (2026-09-25): nfl-slate-refresh's run_nfl_week.sh ALREADY does both three times a day, and
  # calling nfl_slate_props_build.py standalone pulls in nfl_slate_games_build, which wants a
  # git-ignored team_mapping.parquet that only the earlier pipeline steps produce and which
  # re-syncs a 643k-row odds history into pandas — OOM over 2Gi. Injuries reach the report through
  # nfl_slate_props, which the 14:00 refresh has already rebuilt by the time this runs.
  #
  # 15:00 UTC (11am ET) is deliberately AFTER nfl-slate-refresh's 14:00 run, which takes ~11 min.
  # No NFL_SEASON/NFL_WEEK here on purpose: unlike run_nfl_week.sh this does not resolve and
  # export a week, so both scripts resolve the current slate from nfl_slate_games themselves.
  - type: cron
    name: nfl-prop-report-daily
    runtime: python
    # standard (2GB): score_props_week.py trains a model per market over the full priced-line
    # history — same memory profile that OOM-killed fp-data-inseason on the 512Mi default.
    plan: standard
    schedule: "0 15 * 9-12,1-2 *"          # daily 11am ET, NFL season
    buildCommand: >-
      pip install -r research/requirements.txt &&
      printf 'SUPABASE_SERVICE_KEY=%s\nCFBD_API_KEY=%s\nODDS_API_KEY=%s\n'
      "$SUPABASE_SERVICE_KEY" "$CFBD_API_KEY" "$ODDS_API_KEY" > .env.local
    # Each step guarded: a thin board or a stale upstream must not stop the later steps, and
    # every one of these is idempotent for the week (they replace, not append).
    startCommand: cd research/nfl-extreme-outcomes && { python3 score_props_week.py || true; } && python3 nfl_prop_narratives.py
    envVars:
      - fromGroup: wagerproof-model-secrets
      - key: PYTHON_VERSION
        value: "3.11.9"

  # --- NFL GAME-DAY injury re-score (owner 2026-09-15). Inactives post 90 min before
  # kickoff, so the 14/18/22 UTC refresh misses every Sunday 1pm inactive and every
  # primetime one. These re-run the SAME idempotent runner (ESPN injuries -> fetch ->
  # props) at 15:45 UTC (1pm ET inactives at 15:30), 19:45 (4:05/4:25 games) and
  # 23:00 (SNF) on Sundays, and 23:00 UTC on Mon/Thu/Sat for the night game. The
  # nflverse injuries file is a post-week archive and is NOT a source here.
  - type: cron
    name: nfl-slate-gameday-sun
    runtime: python
    plan: standard
    schedule: "45 15,19 * 9-12,1 0"
    buildCommand: >-
      pip install -r research/requirements.txt &&
      printf 'SUPABASE_SERVICE_KEY=%s\nCFBD_API_KEY=%s\nODDS_API_KEY=%s\n'
      "$SUPABASE_SERVICE_KEY" "$CFBD_API_KEY" "$ODDS_API_KEY" > .env.local
    startCommand: cd research/nfl-extreme-outcomes && bash run_nfl_week.sh && { python3 refresh_nfl_slate_lines.py || true; }
    envVars:
      - fromGroup: wagerproof-model-secrets
      - key: PYTHON_VERSION
        value: "3.11.9"

  - type: cron
    name: nfl-slate-gameday-prime
    runtime: python
    plan: standard
    schedule: "0 23 * 9-12,1 0,1,4,6"
    buildCommand: >-
      pip install -r research/requirements.txt &&
      printf 'SUPABASE_SERVICE_KEY=%s\nCFBD_API_KEY=%s\nODDS_API_KEY=%s\n'
      "$SUPABASE_SERVICE_KEY" "$CFBD_API_KEY" "$ODDS_API_KEY" > .env.local
    startCommand: cd research/nfl-extreme-outcomes && bash run_nfl_week.sh && { python3 refresh_nfl_slate_lines.py || true; }
    envVars:
      - fromGroup: wagerproof-model-secrets
      - key: PYTHON_VERSION
        value: "3.11.9"

  # --- Fantasy Points Data Suite in-season pull (owner 2026-09-16: "$200 for this data,
  # get everything"). fp_pull.py --inseason re-pulls the last completed week +/-1 for every
  # tool/scope the subscription can read (29 tools, 46 scopes) into raw cells, then
  # fp_load.py upserts the lean rows (current + prior season) into fp_data. Tue 12:00 UTC
  # after MNF grades, Thu 12:00 UTC to catch FP's charting corrections. Full 2021+ history
  # is the local parquet warehouse, not this cron. FP_DATA_TOKEN = the web app's JWT.
  - type: cron
    name: fp-data-inseason
    runtime: python
    # standard (2GB): the pull succeeds, then fp_load.py holds every pulled cell's frame in
    # memory to upsert it and OOM-killed the default 512Mi on 2026-09-22 (week 3 — 138 cells,
    # and the pull grows with each week of the season). Same reason nfl-slate-weekly is standard.
    plan: standard
    schedule: "0 12 * 9-12,1-2 2,4"
    buildCommand: >-
      pip install -r research/requirements.txt &&
      printf 'SUPABASE_SERVICE_KEY=%s\nFP_DATA_TOKEN=%s\n'
      "$SUPABASE_SERVICE_KEY" "$FP_DATA_TOKEN" > .env.local
    # After the pull: refresh play-by-play and write the FEATURED MATCHUPS facts
    # (nfl_matchup_facts) for the regression report — the only job whose disk has
    # the Fantasy Points parquets (six lean ones are git-tracked under
    # data/fpdata_hist so the prior season is present on a fresh clone; the
    # builder merges them with the freshly pulled data/fpdata). Best
    # effort: a failure here must not fail the data pull.
    startCommand: cd research/nfl-extreme-outcomes && python3 fp_pull.py --inseason --workers 3 && python3 fp_load.py && { python3 refresh_pbp_current.py && python3 nfl_matchup_facts.py || true; } && { python3 score_props_week.py || true; } && { python3 nfl_prop_narratives.py || true; } && { python3 nfl_week_storylines.py || true; }
    envVars:
      - fromGroup: wagerproof-model-secrets
      - key: PYTHON_VERSION
        value: "3.11.9"

  # --- CFB mid-week slate REFRESH (owner 2026-08-28: lines move all week, so the
  # line-sensitive signal flags must recompute, not just the displayed numbers).
  # Reuses the EXACT weekly pipeline — idempotent by design, so a refresh with
  # unchanged inputs reproduces the same slate and only line-dependent flags/picks
  # move. 3x daily ~10am/2pm/6pm ET incl. Saturday pre-kickoff; the 15-min
  # refresher (cfb-live-odds-hourly) keeps lines + pick sides coherent between
  # full rebuilds. Monday's weekly run remains the canonical slate build.
  - type: cron
    name: cfb-slate-refresh
    runtime: python
    plan: standard
    schedule: "0 14,18,22 * 8-12,1 *"      # daily 10am/2pm/6pm ET, CFB season
    buildCommand: >-
      pip install -r research/requirements.txt &&
      printf 'SUPABASE_SERVICE_KEY=%s\nCFBD_API_KEY=%s\nODDS_API_KEY=%s\n'
      "$SUPABASE_SERVICE_KEY" "$CFBD_API_KEY" "$ODDS_API_KEY" > .env.local
    startCommand: cd research/cfb-model && bash run_cfb_week.sh && { python3 refresh_cfb_slate_lines.py || true; }
    envVars:
      - fromGroup: wagerproof-model-secrets
      - key: PYTHON_VERSION
        value: "3.11.9"

  # --- Post-game grading (both sports): finals -> player logs -> grade picks/props/signals
  - type: cron
    name: nfl-cfb-grade-daily
    runtime: python
    # Two fills/day: the CFBD snapshot can land finals AFTER the 13:00 pass (seen
    # 2026-09-04: Thu-night finals hit cfb_games ~14:00 UTC, so 13:00 missed them by
    # an hour and grading slipped a day). The 16:00 pass catches them; pg_cron job
    # 'football-grade-daily' (CFB instance) grades 30 min after each pass.
    # 08:00 UTC pass added (owner 2026-09-20): NFL finals come from nflverse overnight and CFB
    # finals from the cfb_automation snapshot's 04/07 UTC passes, so a 4am ET grade fills the
    # slate finals the 08:30 UTC report run needs for the model record.
    schedule: "0 8,13,16 * 8-12,1-2 *"     # ~4am + ~8-9am + ~11am-noon ET, both seasons
    buildCommand: >-
      pip install -r research/requirements.txt &&
      printf 'SUPABASE_SERVICE_KEY=%s\nCFBD_API_KEY=%s\nODDS_API_KEY=%s\n'
      "$SUPABASE_SERVICE_KEY" "$CFBD_API_KEY" "$ODDS_API_KEY" > .env.local
    startCommand: cd research/nfl-extreme-outcomes && bash grade_week.sh 2026
    envVars:
      - fromGroup: wagerproof-model-secrets
      - key: PYTHON_VERSION          # freeze-env pair: pinned requirements need cp311 wheels
        value: "3.11.9"

  # --- Live PRE-GAME odds collector (NFL) -> nfl_historical_odds (open/movement/close series) ---
  # Hourly; the script self-gates: 3x/day for future-day games, hourly for today's, PRE-GAME only
  # (skips any event already kicked off). Feeds the FG + 1H models. Cost-guards on idle hours.
  - type: cron
    name: nfl-live-odds-hourly
    runtime: python
    schedule: "*/15 * * 8-12,1-2 *"   # every 15 min (owner 2026-08-17): today's games each run until kickoff; future days still 3x/day (script gates on minute<15)
    buildCommand: >-
      pip install -r research/requirements.txt &&
      printf 'SUPABASE_SERVICE_KEY=%s\nCFBD_API_KEY=%s\nODDS_API_KEY=%s\n'
      "$SUPABASE_SERVICE_KEY" "$CFBD_API_KEY" "$ODDS_API_KEY" > .env.local
    # refresh_nfl_slate_lines closes the capture->display loop (CFB port,
    # 2026-08-30: first run found 10 silently-crossed pick sides). Guarded.
    startCommand: >-
      cd research/nfl-extreme-outcomes && python3 live_odds.py --write &&
      { python3 refresh_nfl_slate_lines.py || true; }
    envVars:
      - fromGroup: wagerproof-model-secrets
      - key: PYTHON_VERSION          # freeze-env pair: pinned requirements need cp311 wheels
        value: "3.11.9"

  # --- Live PRE-GAME odds collector (CFB) -> ncaaf_odds_history (FG; bulk endpoint, ~3 credits/run).
  # Same cadence + pre-game guard as NFL. CFB 1H/TT odds ride fetch_event_odds.py separately.
  - type: cron
    name: cfb-live-odds-hourly
    runtime: python
    schedule: "*/15 * * 8-12,1 *"           # every 15 min (owner 2026-08-17): today's games each run until kickoff; future days still 3x/day (script gates on minute<15)
    buildCommand: >-
      pip install -r research/requirements.txt &&
      printf 'SUPABASE_SERVICE_KEY=%s\nCFBD_API_KEY=%s\nODDS_API_KEY=%s\n'
      "$SUPABASE_SERVICE_KEY" "$CFBD_API_KEY" "$ODDS_API_KEY" > .env.local
    # refresh_cfb_slate_lines closes the capture->display loop every run: the
    # slate rows the clients read were frozen at Monday's build (owner 2026-08-28,
    # TCU showed -7.5 while the live number was -9). Guarded — a refresh failure
    # must never block the captures.
    startCommand: >-
      cd research/cfb-model && python3 live_odds_cfb.py --write &&
      python3 live_odds_cfb_1h.py --write &&
      { python3 refresh_cfb_slate_lines.py || true; }
    envVars:
      - fromGroup: wagerproof-model-secrets
      - key: PYTHON_VERSION          # freeze-env pair: pinned requirements need cp311 wheels
        value: "3.11.9"

  # --- Weekly pick'em competition sync -> MAIN comp_weeks/comp_games (consensus lines,
  # finals via Odds API /scores, grading via comp_grade_week RPC). Stdlib-only script;
  # writes through the Supabase Management API (SUPABASE_PAT), so no service key needed.
  - type: cron
    name: competition-sync-hourly
    runtime: python
    schedule: "30 * * 8-12,1-2 *"           # hourly at :30, football season
    buildCommand: pip install tzdata   # stdlib otherwise; tzdata wheel guarantees zoneinfo
    startCommand: cd research/competition && python3 comp_sync.py
    envVars:
      - key: ODDS_API_KEY
        sync: false
      - key: SUPABASE_PAT
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"

  # --- Live PRE-GAME player-props collector (NFL) -> nfl_player_props (6 markets, 4 books;
  # per-event endpoint). Live counterpart to props_backfill+parse+load. Self-contained:
  # rosters come from nfl_player_profiles (Supabase), so no gitignored parquet dependency.
  # Same hourly cadence + pre-game guard + idle cost-guard as nfl-live-odds-hourly. Feeds
  # the prop signals P1-P13 (closing line = T-60 snapshot per the closing-line policy).
  - type: cron
    name: nfl-live-props-hourly
    runtime: python
    schedule: "*/15 * * 8-12,1-2 *"   # every 15 min (owner 2026-08-17): today's games each run until kickoff; future days still 3x/day (script gates on minute<15)
    buildCommand: >-
      pip install -r research/requirements.txt &&
      printf 'SUPABASE_SERVICE_KEY=%s\nCFBD_API_KEY=%s\nODDS_API_KEY=%s\n'
      "$SUPABASE_SERVICE_KEY" "$CFBD_API_KEY" "$ODDS_API_KEY" > .env.local
    # After capture, hourly (minute<15 runs only) rebuild the player pages so the
    # props surface tracks what books ACTUALLY post: no posted line -> no card
    # (owner rule 2026-08-27), and newly posted players appear within the hour.
    startCommand: >-
      cd research/nfl-extreme-outcomes && { python3 refresh_player_offense.py || true; } &&
      python3 live_props.py --write &&
      { if [ "$(date +%M)" -lt 15 ]; then
          SW=$(python3 resolve_nfl_week.py) &&
          NFL_SEASON="${SW% *}" NFL_WEEK="${SW#* }" python3 gen_nfl_prop_player_pages.py;
        fi || true; }
    envVars:
      - fromGroup: wagerproof-model-secrets
      - key: PYTHON_VERSION          # freeze-env pair: pinned requirements need cp311 wheels
        value: "3.11.9"

  # --- Football pipeline watchdog: probes DATA freshness (line feeds alive, slates
  # present, picks regenerated, lines posted on imminent games, grading not stale)
  # and exits non-zero only when something is silently wrong — Render's failure
  # email is the alert. Catches the failures a green cron can hide.
  - type: cron
    name: football-health-sweep
    runtime: python
    schedule: "45 10 * 8-12,1-2 *"        # daily 6:45am ET, football season
    buildCommand: pip install requests
    startCommand: cd research && python3 health_sweep.py
    envVars:
      - fromGroup: wagerproof-model-secrets
