name: Android release (Play)

# Publishes a signed Play bundle. Deliberately NOT triggered by plain pushes to
# main: versionCode is pinned to the iOS build number by hand (see
# app/build.gradle.kts), so an automatic per-push upload would re-send a
# duplicate versionCode and be rejected by Play. Release is an explicit act.
on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play track to publish to"
        required: true
        default: internal
        type: choice
        options: [internal, alpha, beta, production]
      status:
        description: "Release status on that track"
        required: true
        default: completed
        type: choice
        options: [completed, draft, inProgress]
  push:
    tags: ["android-v*"]

concurrency:
  group: android-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: wagerproof-android-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      # Firebase/FCM. Android push stays dead without this, exactly as the
      # retired React Native app shipped — so it warns rather than failing,
      # until com.wagerproof.mobile is registered in the Firebase console.
      - name: Configure Firebase
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          umask 077
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::warning::GOOGLE_SERVICES_JSON_BASE64 unset — shipping without FCM; push notifications will not register."
            exit 0
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json

      # Unlike the verify workflow, signing is mandatory here: an unsigned
      # bundle cannot be uploaded, so a missing secret must fail loudly rather
      # than produce an artifact that looks fine and is unusable.
      - name: Configure release signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.WAGERPROOF_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.WAGERPROOF_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.WAGERPROOF_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.WAGERPROOF_RELEASE_KEY_PASSWORD }}
        run: |
          umask 077
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            eval "value=\$$name"
            if [ -z "$value" ]; then
              echo "Missing required release signing secret: $name" >&2
              exit 1
            fi
          done
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wagerproof-release.keystore"
          {
            echo "WAGERPROOF_RELEASE_STORE_FILE=$RUNNER_TEMP/wagerproof-release.keystore"
            echo "WAGERPROOF_RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD"
            echo "WAGERPROOF_RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
            echo "WAGERPROOF_RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed bundle
        env:
          FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
          FACEBOOK_CLIENT_TOKEN: ${{ secrets.FACEBOOK_CLIENT_TOKEN }}
        run: ./gradlew :app:bundleRelease --stacktrace

      - name: Read version
        id: version
        run: |
          versionCode=$(grep -oE 'versionCode = [0-9]+' app/build.gradle.kts | grep -oE '[0-9]+')
          versionName=$(grep -oE 'versionName = "[^"]+"' app/build.gradle.kts | cut -d'"' -f2)
          echo "code=$versionCode" >> "$GITHUB_OUTPUT"
          echo "name=$versionName" >> "$GITHUB_OUTPUT"
          echo "Building $versionName ($versionCode)"

      # Kept for 90 days so a Play-rejected upload can be inspected or
      # re-submitted by hand without re-running the whole build.
      - name: Archive bundle and mapping
        uses: actions/upload-artifact@v4
        with:
          name: wagerproof-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          retention-days: 90
          if-no-files-found: error
          path: |
            wagerproof-android-native/app/build/outputs/bundle/release/app-release.aab
            wagerproof-android-native/app/build/outputs/mapping/release/mapping.txt

      - name: Publish to Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.wagerproof.mobile
          releaseFiles: wagerproof-android-native/app/build/outputs/bundle/release/app-release.aab
          # R8 is on for release, so without this every Play crash report is
          # unreadable stack frames.
          mappingFile: wagerproof-android-native/app/build/outputs/mapping/release/mapping.txt
          track: ${{ inputs.track || 'internal' }}
          status: ${{ inputs.status || 'completed' }}
